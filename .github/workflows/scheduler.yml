name: Blog scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspirovate-blog-scheduler
  cancel-in-progress: false
jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || vars.BLOG_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run scheduler:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2.5-sunburst' }}
          GITHUB_PROJECTS_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          FLOWERS_GITHUB_TOKEN: ${{ secrets.FLOWERS_GITHUB_TOKEN }}
