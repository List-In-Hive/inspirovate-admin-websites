name: Blog scheduler
on:
  schedule:
    # Avoid the top-of-hour peak while keeping hourly checks.
    - cron: '4 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [inspirovate-supabase-schedule]
permissions:
  contents: read
concurrency:
  group: inspirovate-blog-scheduler
  cancel-in-progress: false
jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || vars.BLOG_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: WEBSITES
    # Up to six sequential image requests plus research and editorial checks.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run scheduler:once
        env:
          SCHEDULER_EVENT_ACTION: ${{ github.event.action }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2.5-sunburst' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
          GITHUB_PROJECTS_TOKEN: ${{ secrets.PROJECTS_GITHUB_TOKEN }}
          FLOWERS_GITHUB_TOKEN: ${{ secrets.FLOWERS_GITHUB_TOKEN }}
