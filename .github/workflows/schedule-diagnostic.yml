name: Schedule diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/schedule-diagnostic.yml']
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record trigger and UTC time
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          printf 'Trigger: %s\n' "$TRIGGER"
          date -u '+UTC: %Y-%m-%dT%H:%M:%SZ'
